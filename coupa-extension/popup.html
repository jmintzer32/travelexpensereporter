<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1e293b;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      color: #4f46e5;
    }
    .status {
      padding: 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #4338ca;
    }
    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .instructions {
      font-size: 12px;
      color: #64748b;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <h2>Coupa Expense Filler</h2>
  
  <div class="status" id="status-box">
    Checking for pending expenses...
  </div>

  <button id="fill-btn" disabled>Open filler on this page</button>

  <div class="instructions">
    <strong>How to use:</strong><br>
    1. In Travel Expense Reporter, click <b>Send</b> under “Chrome extension”.<br>
    2. Open your Coupa expense report tab.<br>
    3. Click the button above, then <b>Fill next</b> in the panel.
  </div>

  <script src="popup.js"></script>
</body>
</html>
